<!-- @dsCard group="Colors" viewport="700x150" name="Core Palette" subtitle="Poison-green + gold on ink-black — the signature combo" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--ink-black); font-family: var(--font-condensed); }
  .row { display: flex; gap: 2px; padding: 14px; }
  .sw { flex: 1; height: 118px; border-radius: var(--radius-md); display: flex; flex-direction: column;
        justify-content: flex-end; padding: 10px; box-sizing: border-box; }
  .name { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; }
  .hex { font-size: 11px; letter-spacing: 0.04em; opacity: 0.75; font-family: var(--font-body); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--ink-black); border:1px solid var(--line-hairline);"><span class="name" style="color:var(--bone-white)">Ink Black</span><span class="hex" style="color:var(--bone-white)">#0D0D12</span></div>
    <div class="sw" style="background:var(--smoke-charcoal)"><span class="name" style="color:var(--bone-white)">Smoke</span><span class="hex" style="color:var(--bone-white)">#1B1B24</span></div>
    <div class="sw" style="background:var(--poison-green); box-shadow:var(--glow-green-md)"><span class="name" style="color:var(--ink-black)">Poison Green</span><span class="hex" style="color:var(--ink-black)">#00F5A5</span></div>
    <div class="sw" style="background:var(--venom-green)"><span class="name" style="color:var(--ink-black)">Venom</span><span class="hex" style="color:var(--ink-black)">#08B078</span></div>
    <div class="sw" style="background:var(--ritual-gold); box-shadow:var(--glow-gold-sm)"><span class="name" style="color:var(--ink-black)">Ritual Gold</span><span class="hex" style="color:var(--ink-black)">#E3BB72</span></div>
    <div class="sw" style="background:var(--bone-white)"><span class="name" style="color:var(--ink-black)">Bone White</span><span class="hex" style="color:var(--ink-black)">#F2EFE2</span></div>
  </div>
</body>
</html>
