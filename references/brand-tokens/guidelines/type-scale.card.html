<!-- @dsCard group="Type" viewport="700x150" name="Type Scale" subtitle="Display / H1 / H2 / H3 / body / caption" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--ink-black); padding: 16px 24px; font-family: var(--font-condensed); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: baseline; gap: 14px; padding: 5px 0; border-bottom: 1px solid var(--line-hairline); }
  .tok { color: var(--poison-green); font-size: 12px; width: 130px; letter-spacing: 0.04em; font-family: var(--font-body); }
  .val { color: var(--sage-bone); font-size: 12px; font-family: var(--font-body); }
  .demo { color: var(--bone-white); text-transform: uppercase; margin-left: auto; }
</style>
</head>
<body>
  <ul>
    <li><span class="tok">--fs-display</span><span class="val">96 / 700 / Metal Mania</span><span class="demo" style="font-size:26px;font-family:var(--font-display)">Aa</span></li>
    <li><span class="tok">--fs-h1</span><span class="val">64 / Anton / uppercase</span><span class="demo" style="font-size:24px;font-family:var(--font-headline)">Aa</span></li>
    <li><span class="tok">--fs-h2</span><span class="val">40 / Anton</span><span class="demo" style="font-size:20px;font-family:var(--font-headline)">Aa</span></li>
    <li><span class="tok">--fs-body</span><span class="val">17 / Archivo / 1.55</span><span class="demo" style="font-size:15px;font-family:var(--font-body);text-transform:none">Aa</span></li>
    <li><span class="tok">--fs-caption</span><span class="val">12 / Archivo</span><span class="demo" style="font-size:12px;font-family:var(--font-body);text-transform:none">Aa</span></li>
  </ul>
</body>
</html>
