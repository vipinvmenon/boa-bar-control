<!-- @dsCard group="Colors" viewport="700x150" name="Support & Semantic" subtitle="Sage-bone, deep-gold shadow, and role tokens" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--ink-black); font-family: var(--font-condensed); padding: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cell { background: var(--smoke-charcoal); border: 1px solid var(--line-hairline); border-radius: var(--radius-md);
          padding: 10px; display: flex; align-items: center; gap: 10px; }
  .dot { width: 26px; height: 26px; border-radius: 50%; flex: none; }
  .lbl { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--bone-white); font-weight: 600; line-height: 1.3; }
  .lbl small { display: block; font-family: var(--font-body); opacity: 0.55; letter-spacing: 0.02em; text-transform: none; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><span class="dot" style="background:var(--sage-bone)"></span><span class="lbl">Sage Bone<small>#A6C9B4 · muted text</small></span></div>
    <div class="cell"><span class="dot" style="background:var(--deep-gold)"></span><span class="lbl">Deep Gold<small>#C0A060 · borders</small></span></div>
    <div class="cell"><span class="dot" style="background:var(--surface-raised)"></span><span class="lbl">Raised<small>#24242F · hover</small></span></div>
    <div class="cell"><span class="dot" style="background:var(--surface-sunken)"></span><span class="lbl">Sunken<small>#08080C · well</small></span></div>
    <div class="cell"><span class="dot" style="background:var(--poison-green)"></span><span class="lbl">Text Primary<small>--text-primary</small></span></div>
    <div class="cell"><span class="dot" style="background:var(--ritual-gold)"></span><span class="lbl">Text Accent<small>--text-accent</small></span></div>
    <div class="cell"><span class="dot" style="background:var(--bone-white)"></span><span class="lbl">Text Strong<small>--text-strong</small></span></div>
    <div class="cell"><span class="dot" style="background:var(--sage-bone)"></span><span class="lbl">Text Muted<small>--text-muted</small></span></div>
  </div>
</body>
</html>
