<!-- @dsCard group="Type" viewport="700x220" name="Display & Headline" subtitle="Metal Mania wordmark + Anton condensed headline" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--ink-black); padding: 20px 24px; }
  .wm { font-family: var(--font-display); font-size: 72px; color: var(--poison-green);
        text-shadow: var(--glow-green-text); line-height: 0.95; }
  .hl { font-family: var(--font-headline); font-size: 44px; color: var(--bone-white);
        text-transform: uppercase; letter-spacing: var(--tr-headline); line-height: 1.02; margin-top: 14px; }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--sage-bone);
          letter-spacing: 0.04em; margin-top: 12px; }
</style>
</head>
<body>
  <div class="wm">Bangalore</div>
  <div class="hl">Open Air 2026</div>
  <div class="meta">Display · Metal Mania · 96px / 0.92 &nbsp;|&nbsp; H1 · Anton · 64px / 1.02 · uppercase</div>
</body>
</html>
