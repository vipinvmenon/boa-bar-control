<!-- @dsCard group="Type" viewport="700x200" name="Eyebrow, Data Line & Body" subtitle="Rye badge · Oswald gold data line · Archivo body" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--ink-black); padding: 20px 24px; }
  .eyebrow { font-family: var(--font-eyebrow); font-size: 20px; color: var(--bone-white);
             letter-spacing: var(--tr-eyebrow); text-transform: uppercase; }
  .star { color: var(--poison-green); margin: 0 8px; }
  .data { font-family: var(--font-condensed); font-weight: 700; font-size: 22px; color: var(--ritual-gold);
          letter-spacing: var(--tr-data); text-transform: uppercase; margin-top: 16px; text-shadow: var(--glow-gold-text); }
  .body { font-family: var(--font-body); font-size: 15px; color: var(--text-body); line-height: 1.55;
          max-width: 560px; margin-top: 14px; }
  .cap { font-family: var(--font-body); font-size: 12px; color: var(--text-muted); margin-top: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="eyebrow">Rock<span class="star">✦</span>N<span class="star">✦</span>Roll<span class="star">✦</span>Originals</div>
  <div class="data">Saturday | 10th October 2026 | Bengaluru, India</div>
  <div class="body">India's longest-running outdoor metal festival returns for its 2026 ritual. Clean grotesque body copy stays legible on the smallest ad crop.</div>
  <div class="cap">Caption · Archivo · 12px · muted</div>
</body>
</html>
