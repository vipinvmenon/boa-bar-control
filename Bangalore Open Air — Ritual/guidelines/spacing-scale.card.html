<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing Scale" subtitle="4px base — ritual layouts breathe" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--ink-black); padding: 20px 24px; font-family: var(--font-body);
         display: flex; align-items: flex-end; gap: 16px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--poison-green); width: 22px; box-shadow: var(--glow-green-sm); border-radius: 2px 2px 0 0; }
  .t { font-size: 10px; color: var(--sage-bone); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="col"><div class="bar" style="height:4px"></div><span class="t">1 · 4</span></div>
  <div class="col"><div class="bar" style="height:8px"></div><span class="t">2 · 8</span></div>
  <div class="col"><div class="bar" style="height:12px"></div><span class="t">3 · 12</span></div>
  <div class="col"><div class="bar" style="height:16px"></div><span class="t">4 · 16</span></div>
  <div class="col"><div class="bar" style="height:24px"></div><span class="t">5 · 24</span></div>
  <div class="col"><div class="bar" style="height:32px"></div><span class="t">6 · 32</span></div>
  <div class="col"><div class="bar" style="height:48px"></div><span class="t">7 · 48</span></div>
  <div class="col"><div class="bar" style="height:64px"></div><span class="t">8 · 64</span></div>
  <div class="col"><div class="bar" style="height:96px"></div><span class="t">9 · 96</span></div>
</body>
</html>
