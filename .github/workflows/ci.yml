name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    name: Database gates (advisory until BAR-031)
    runs-on: ubuntu-latest
    # The migrations in supabase/migrations/ have NEVER been executed against
    # PostgreSQL, and the pgTAP suite asserts existence only and never creates
    # the pgtap extension. This job is therefore expected to fail today, and its
    # output is the most useful thing in this pipeline: it is the first real
    # execution of the schema.
    #
    # It is advisory rather than required so a known-unfinished task does not
    # block every merge — a permanently red gate is a gate people stop reading.
    # FLIP THIS TO REQUIRED (delete continue-on-error) THE MOMENT BAR-031 PASSES.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Starts the local Supabase stack and applies every migration.
      # A migration that cannot execute fails the build here, which is the gate
      # that was missing when the schema was first written — see BAR-031.
      - name: Start Supabase
        run: pnpm supabase:start

      - name: Apply migrations from scratch and seed
        run: pnpm supabase:reset

      - name: Behavioural pgTAP suite
        run: pnpm test:db

  design:
    name: Design fidelity
    runs-on: ubuntu-latest
    # Enable once BAR-007 (reference captures) and BAR-008 (harness) land.
    if: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Render each screen and diff against references/ui
        run: pnpm test:visual

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: .visual-diff/
