<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0D12" />
    <meta name="description" content="BOA festival bar inventory and chain-of-custody control." />

    <!--
      BAR-186. iOS does NOT read the web app manifest when somebody uses Add to
      Home Screen — it looks for `apple-touch-icon`, and with none it puts a
      screenshot of the page on the home screen. That is what "missing BOA logo"
      was: not a broken image, an icon iOS never looked for.

      180×180 is the size iOS asks for. It applies its own rounded mask, so this
      one is full-bleed; the Android maskable variant is a different file
      because Android crops to an inner safe zone and this wordmark is wide.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/boa-icon-192.png" />

    <!-- Launches standalone from the home screen on iOS versions that predate
         manifest `display` support, and keeps the status bar dark on all of them. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The label under the icon. Without this iOS uses <title>, which is long
         enough to be truncated on a home screen. -->
    <meta name="apple-mobile-web-app-title" content="Bar Control" />

    <title>BOA Bar Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
